name: Build Brussels Agenda

on:
  workflow_dispatch:
  schedule:
    # Weekdays only (Mon-Fri). Times are UTC.
#    - cron: "15 6 * * 1-5"
#    - cron: "15 15 * * 1-5"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: brussels-agenda
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build calendar
        run: |
          python scripts/build_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "brussels-agenda-bot"
          git config user.email "brussels-agenda-bot@users.noreply.github.com"
          git add brussels.ics brussels.csv brussels.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Brussels agenda (rolling 30d)"
          git push
