name: Build Brussels Agenda

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC. :contentReference[oaicite:2]{index=2}
    # Morning Brussels pass (roughly): 06:15 UTC Mon–Fri
    - cron: "15 6 * * 1-5"
    # Afternoon Brussels pass (roughly): 15:15 UTC Mon–Fri
    - cron: "15 15 * * 1-5"

permissions:
  contents: write  # allow committing brussels.ics/csv back to the repo :contentReference[oaicite:3]{index=3}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build calendar
        run: |
          python scripts/build_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "brussels-agenda-bot"
          git config user.email "brussels-agenda-bot@users.noreply.github.com"
          git add brussels.ics brussels.csv
          git diff --cached --quiet || git commit -m "Update Brussels agenda (rolling 14d)"
          git push
